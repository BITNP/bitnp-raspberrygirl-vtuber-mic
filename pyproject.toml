[project]
name = "bitnp-raspberrygirl-vtuber-mic"
version = "0.1.0"
description = "Mode-agnostic microphone service scaffold for the distributed AI VTuber system."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.0,<3",
    "onnxruntime-gpu[cuda,cudnn]>=1.21,<1.24; (sys_platform == 'linux' or sys_platform == 'win32') and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
    "onnxruntime>=1.20,<2; (sys_platform != 'linux' and sys_platform != 'win32') or (platform_machine != 'x86_64' and platform_machine != 'AMD64')",
    "sounddevice==0.5.5",
    "websockets==16.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.31,<2",
    "pytest>=8",
    "ruff>=0.12",
]

[project.scripts]
mic-health = "mic.health:main"
mic-stream = "mic.stream_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mic"]
include = ["src/mic/models/*.onnx", "src/mic/models/*.onnx.data", "src/mic/models/*.json"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
markers = [
    "real_adapter: opt-in smoke tests for live or fake-local real adapter boundaries",
]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
venvPath = "."
venv = ".venv"
stubPath = "typings"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = []
