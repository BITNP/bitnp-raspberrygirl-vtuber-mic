[project]
name = "bitnp-raspberrygirl-vtuber-mic"
version = "0.1.0"
description = "Mode-agnostic microphone service scaffold for the distributed AI VTuber system."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
    "onnxruntime>=1.20,<2",
    "sounddevice==0.5.5",
    "websockets==16.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.31,<2",
    "pytest>=8",
]

[project.scripts]
mic-health = "mic.health:main"
mic-stream = "mic.stream_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mic"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
markers = [
    "real_adapter: opt-in smoke tests for live or fake-local real adapter boundaries",
]

[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
